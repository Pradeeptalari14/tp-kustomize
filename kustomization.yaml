apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: production

namePrefix: prod-

commonLabels:
  environment: production
  tier: backend
  owner: sre-platform

images:
  - name: app-backend
    newName: ghcr.io/pradeeptalari14/app-backend
    newTag: v2.4.0

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - ENABLE_TRACING=true
      - RETRY_MAX_ATTEMPTS=5

patchesStrategicMerge:
  - replica-patch.yaml
  - resources-patch.yaml
